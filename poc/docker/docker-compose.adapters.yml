# poc/docker/docker-compose.adapters.yml
# AM 플랫폼 Mock Adapter 5종 컨테이너 구성
# 사용법: docker compose -f poc/docker/docker-compose.adapters.yml up -d --build
#
# 전제 조건: poc/docker/docker-compose.yml 로 인프라(Kafka 등)가 먼저 기동되어 있어야 한다.
# 공유 네트워크 am-network 는 docker-compose.yml 에서 생성된 것을 사용한다.
#
# ⭐️ 변경(Day 8 작업4-5): 5개 Adapter 전부 healthcheck 명령을 curl에서
# python3 내장 기능으로 교체했다. Adapter는 python:3.11-slim이라는
# 가벼운 기본 이미지를 쓰는데, 이 이미지엔 curl이 설치되어 있지 않다.
# 그래서 기존 healthcheck(curl -f ...)는 컨테이너 안에서 매번
# "명령어를 찾을 수 없음"으로 실패했고, Docker는 이를 실제 서버 장애로
# 오해해 "unhealthy"로 표시했다 — 정작 밖에서 포트로 직접 확인하면
# 정상 응답(200)이 나오던 이유. curl을 새로 설치하는 대신(이미지
# 용량 증가, 설치 중 네트워크 의존성 발생), 파이썬에 이미 내장된
# urllib으로 대체해 문제를 해결했다.

version: "3.8"

services:

  # ─────────────────────────────────────────
  # SMS Mock Adapter (포트: 8101)
  # ─────────────────────────────────────────
  sms-adapter:
    build:
      context: ..
      dockerfile: services/sms-adapter/Dockerfile
    container_name: am-sms-adapter
    ports:
      - "8101:8101"
    environment:
      ADAPTER_PORT: "8101"
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC_DISPATCH_SMS: topic.send.dispatch.sms
      KAFKA_TOPIC_RESULT: topic.send.result
      KAFKA_TOPIC_RETRY: topic.send.retry
      SMS_SUCCESS_RATE: "${SMS_SUCCESS_RATE:-0.95}"
      SMS_DELAY_MS: "${SMS_DELAY_MS:-50}"
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
    networks:
      - am-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8101/health', timeout=3).status == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ─────────────────────────────────────────
  # MMS Mock Adapter (포트: 8102)
  # ─────────────────────────────────────────
  mms-adapter:
    build:
      context: ..
      dockerfile: services/mms-adapter/Dockerfile
    container_name: am-mms-adapter
    ports:
      - "8102:8102"
    environment:
      ADAPTER_PORT: "8102"
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC_DISPATCH_MMS: topic.send.dispatch.mms
      KAFKA_TOPIC_RESULT: topic.send.result
      KAFKA_TOPIC_RETRY: topic.send.retry
      MMS_SUCCESS_RATE: "${MMS_SUCCESS_RATE:-0.93}"
      MMS_DELAY_MS: "${MMS_DELAY_MS:-80}"
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
    networks:
      - am-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8102/health', timeout=3).status == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ─────────────────────────────────────────
  # RCS Mock Adapter (포트: 8103)
  # ─────────────────────────────────────────
  rcs-adapter:
    build:
      context: ..
      dockerfile: services/rcs-adapter/Dockerfile
    container_name: am-rcs-adapter
    ports:
      - "8103:8103"
    environment:
      ADAPTER_PORT: "8103"
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC_DISPATCH_RCS: topic.send.dispatch.rcs
      KAFKA_TOPIC_RESULT: topic.send.result
      KAFKA_TOPIC_RETRY: topic.send.retry
      RCS_SUCCESS_RATE: "${RCS_SUCCESS_RATE:-0.90}"
      RCS_DELAY_MS: "${RCS_DELAY_MS:-60}"
      RCS_FALLBACK_RATE: "${RCS_FALLBACK_RATE:-0.07}"
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
    networks:
      - am-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8103/health', timeout=3).status == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ─────────────────────────────────────────
  # FAX Mock Adapter (포트: 8104)
  # ─────────────────────────────────────────
  fax-adapter:
    build:
      context: ..
      dockerfile: services/fax-adapter/Dockerfile
    container_name: am-fax-adapter
    ports:
      - "8104:8104"
    environment:
      ADAPTER_PORT: "8104"
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC_DISPATCH_FAX: topic.send.dispatch.fax
      KAFKA_TOPIC_RESULT: topic.send.result
      KAFKA_TOPIC_RETRY: topic.send.retry
      FAX_SUCCESS_RATE: "${FAX_SUCCESS_RATE:-0.85}"
      FAX_DELAY_MS: "${FAX_DELAY_MS:-200}"
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
    networks:
      - am-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8104/health', timeout=3).status == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ─────────────────────────────────────────
  # Email Mock Adapter (포트: 8105)
  # ─────────────────────────────────────────
  email-adapter:
    build:
      context: ..
      dockerfile: services/email-adapter/Dockerfile
    container_name: am-email-adapter
    ports:
      - "8105:8105"
    environment:
      ADAPTER_PORT: "8105"
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC_DISPATCH_EMAIL: topic.send.dispatch.email
      KAFKA_TOPIC_RESULT: topic.send.result
      KAFKA_TOPIC_RETRY: topic.send.retry
      EMAIL_SUCCESS_RATE: "${EMAIL_SUCCESS_RATE:-0.98}"
      EMAIL_DELAY_MS: "${EMAIL_DELAY_MS:-30}"
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
    networks:
      - am-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8105/health', timeout=3).status == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 3

networks:
  am-network:
    external: true    # docker-compose.yml 에서 생성된 네트워크 공유
    name: docker_am-network 