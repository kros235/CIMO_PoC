global:
  scrape_interval: 15s
  evaluation_interval: 15s

# ─────────────────────────────────────────────────
# [추가] alert-rules.yml 파일 참조 — 이 줄이 없으면
#        아래에서 만드는 alert-rules.yml을 읽지 않음
# ─────────────────────────────────────────────────
rule_files:
  - "/etc/prometheus/alert-rules.yml"

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "kafka"
    static_configs:
      - targets: ["kafka:1234"] # JMX Exporter endpoint if implemented

  - job_name: "flink"
    static_configs:
      - targets: ["jobmanager:9249", "taskmanager:9249"] 
        
  - job_name: "adapters"
    metrics_path: "/metrics/"
    static_configs:
      - targets:
        - "sms-adapter:8101"
        - "mms-adapter:8102"
        - "rcs-adapter:8103"
        - "fax-adapter:8104"
        - "email-adapter:8105"

  - job_name: "history-api"
    metrics_path: "/metrics/"
    static_configs:
      - targets: ["history-api:8200"]
